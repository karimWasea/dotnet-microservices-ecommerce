name: ECommerce Microservices CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build, Unit & Integration Tests (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore ProductService
        run: dotnet restore services/ProductService/ProductService.slnx

      - name: Build ProductService (Release)
        run: dotnet build services/ProductService/ProductService.slnx --configuration Release --no-restore

      - name: Run ProductService Unit & Architecture Tests
        run: dotnet test services/ProductService/tests/ProductService.UnitTests/ProductService.UnitTests.csproj --configuration Release --no-build --verbosity normal

      - name: Run ProductService Integration Tests (Testcontainers PostgreSQL 17)
        run: dotnet test services/ProductService/tests/ProductService.IntegrationTests/ProductService.IntegrationTests.csproj --configuration Release --no-build --verbosity normal

      - name: Restore UserService
        run: dotnet restore services/UserService/UserService.slnx

      - name: Build UserService (Release)
        run: dotnet build services/UserService/UserService.slnx --configuration Release --no-restore

      - name: Run UserService Unit & Architecture Tests
        run: dotnet test services/UserService/tests/UserService.UnitTests/UserService.UnitTests.csproj --configuration Release --no-build --verbosity normal

      - name: Run UserService Integration Tests (Testcontainers PostgreSQL 17)
        run: dotnet test services/UserService/tests/UserService.IntegrationTests/UserService.IntegrationTests.csproj --configuration Release --no-build --verbosity normal

  docker-build:
    name: Validate Docker Build & Compose
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config -q

      - name: Build ProductService Docker image
        run: docker build -t product-service:ci ./services/ProductService

      - name: Build UserService Docker image
        run: docker build -t user-service:ci ./services/UserService
