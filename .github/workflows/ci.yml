name: ProductService CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION_PATH: services/ProductService/ProductService.slnx

jobs:
  build-and-test:
    name: Build, Unit & Integration Tests (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build solution (Release)
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

      - name: Run Unit & Architecture Tests
        run: dotnet test services/ProductService/tests/ProductService.UnitTests/ProductService.UnitTests.csproj --configuration Release --no-build --verbosity normal

      - name: Run Integration Tests (Testcontainers PostgreSQL 17)
        run: dotnet test services/ProductService/tests/ProductService.IntegrationTests/ProductService.IntegrationTests.csproj --configuration Release --no-build --verbosity normal

  docker-build:
    name: Validate Docker Build & Compose
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config -q

      - name: Build ProductService Docker image
        run: docker build -t product-service:ci ./services/ProductService
